# BIS 2027 — mobile release pipeline (Android AAB + iOS IPA).
#
# NOT EXECUTED YET: it was written on a machine without JDK / Android SDK /
# Xcode, so the first run must be supervised (see docs/MOBILE-STORES.md).
#
# One-time setup in GitHub → Settings:
#   Variables (non-secret):  BIS_APP_URL   production https origin of the site
#                            BIS_APP_ID    permanent reverse-DNS id (e.g. dz.bis2027.summit)
#                            APPLE_TEAM_ID 10-character Apple team id
#   Secrets:  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#             ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#             IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64,
#             IOS_PROFILE_NAME, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID,
#             APPLE_API_KEY_P8_BASE64
# Hardening still to do once the repo is on GitHub: pin every `uses:` to a
# full commit SHA, and protect the `release` environment with required reviewers.
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Marketing version, e.g. 1.0.0"
        required: true
      version_code:
        description: "Monotonic integer build number (Play versionCode / iOS build)"
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  BIS_APP_URL: ${{ vars.BIS_APP_URL }}
  BIS_APP_ID: ${{ vars.BIS_APP_ID }}
  BIS_RELEASE: "1"
  BIS_VERSION_NAME: ${{ inputs.version_name }}
  BIS_VERSION_CODE: ${{ inputs.version_code }}

jobs:
  gate:
    name: Release gate (config + hardening)
    runs-on: ubuntu-latest
    # Releases only ever run from main (signing secrets must not be reachable
    # from an arbitrary branch).
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Validate release inputs
        working-directory: .
        env:
          VN: ${{ inputs.version_name }}
          VC: ${{ inputs.version_code }}
        run: |
          [[ "$VN" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "bad version_name"; exit 1; }
          [[ "$VC" =~ ^[0-9]{1,9}$ ]] || { echo "bad version_code"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: node scripts/sync-www.mjs
      - run: node scripts/harden-native.mjs
      - run: npx cap sync
      - name: Fail on unsafe / unfinished configuration
        run: node scripts/check-config.mjs
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  android:
    name: Android App Bundle (.aab)
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: node scripts/sync-www.mjs
      - run: node scripts/harden-native.mjs
      - run: npx cap sync android
      - name: Restore upload keystore (kept out of the repo)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: bis2027-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS archive (.ipa) → TestFlight
    needs: gate
    runs-on: macos-latest
    environment: release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: node scripts/sync-www.mjs
      - run: node scripts/harden-native.mjs
      - run: npx cap sync ios
      - name: Import signing certificate + profile into a temporary keychain
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$IOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/bis.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$BIS_VERSION_NAME" CURRENT_PROJECT_VERSION="$BIS_VERSION_CODE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution" \
            archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BIS_APP_ID}</key><string>${IOS_PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
      - name: Cleanup secrets
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/bis.mobileprovision"
