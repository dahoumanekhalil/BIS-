# BIS 2027 — mobile release pipeline (Expo / EAS Build).
#
# The app is an Expo (React Native) project in mobile-app/. Store binaries are
# built in the CLOUD by EAS Build, so no Mac / JDK / Android SDK is needed.
#
# NOT EXECUTED YET: first run must be supervised (see docs/MOBILE-STORES.md).
#
# One-time setup:
#   1. `cd mobile-app && npx eas-cli login && npx eas-cli init`   (creates the EAS project id)
#   2. GitHub → Settings → Secrets: EXPO_TOKEN (an Expo access token)
#      GitHub → Settings → Variables: EXPO_PUBLIC_SITE_URL
#      (two apps: public = preview/production, staff = staff-preview/staff-production;
#       each profile pins its own variant + app id in eas.json, and the gate checks both)
#   3. Protect the `release` environment: only `main`, required reviewers.
#   4. Pin every `uses:` to a full commit SHA before the first real run.
# Signing credentials (Android keystore, Apple certificates) are managed by EAS
# (`eas credentials`) — they never live in this repository or in GitHub secrets.
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options: [android, ios, all]
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        options: [preview, production, staff-preview, staff-production]

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}

jobs:
  gate:
    name: Quality + release gate
    runs-on: ubuntu-latest
    # Releases only ever run from main.
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - name: Release gate (URL, app id, security settings)
        run: node scripts/check-release.mjs

  build:
    name: EAS build
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.x
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build (cloud)
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
